name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/ondura/package-lock.json
      - name: Frontend
        working-directory: apps/ondura
        run: |
          npm ci
          npm run build
          npm test
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Third-party notices up to date
        # The license texts shipped with Ondura; regenerate with
        # `python3 scripts/third-party-notices.py` after dependency changes.
        run: |
          python3 scripts/third-party-notices.py
          git diff --exit-code -- THIRD-PARTY-NOTICES.txt

  bundle:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: deb,rpm,appimage
          # One universal app for Apple silicon and Intel Macs.
          - os: macos-latest
            bundles: app,dmg
            target: universal-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      # Windows Authenticode signing (optional secrets, see
      # scripts/windows-sign.ps1): Azure Artifact Signing or a .pfx certificate.
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
      ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
      ARTIFACT_SIGNING_PROFILE: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Artifact Signing client (Windows)
        if: runner.os == 'Windows' && env.ARTIFACT_SIGNING_ACCOUNT != ''
        shell: pwsh
        run: |
          nuget install Microsoft.ArtifactSigning.Client -OutputDirectory "$env:RUNNER_TEMP\artifact-signing" -NonInteractive
          $dlib = Get-ChildItem "$env:RUNNER_TEMP\artifact-signing" -Recurse -Filter Azure.CodeSigning.Dlib.dll | Where-Object { $_.FullName -match "\\x64\\" } | Select-Object -First 1
          if (-not $dlib) { throw "Azure.CodeSigning.Dlib.dll not found" }
          "ARTIFACT_SIGNING_DLIB=$($dlib.FullName)" >> $env:GITHUB_ENV
      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/ondura/package-lock.json
      - name: Build installer
        working-directory: apps/ondura
        env:
          # Client id of the Entra ID app registration (repository variable).
          ONDURA_GRAPH_CLIENT_ID: ${{ vars.ONDURA_GRAPH_CLIENT_ID }}
          # Public key for verifying updates (repository variable, see docs/development.md).
          ONDURA_UPDATE_PUBKEY: ${{ vars.ONDURA_UPDATE_PUBKEY }}
          # macOS code signing and notarization (optional secrets; without
          # them the app is signed ad hoc).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          # Tauri treats set-but-empty Apple variables as configured.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || unset "$v"
          done
          npm ci
          config=()
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Tauri signs ondura.exe, the NSIS installer and its uninstaller
            # with this command (it does nothing without signing secrets).
            script="$(cygpath -m "$GITHUB_WORKSPACE")/scripts/windows-sign.ps1"
            config=(--config "{\"bundle\":{\"windows\":{\"signCommand\":\"pwsh -NoProfile -File $script %1\"}}}")
          fi
          npx tauri build --bundles ${{ matrix.bundles }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }} "${config[@]}"
      - name: Name the silent installer
        # The plain NSIS installer (software distribution, /S, updater) gets a
        # name that is clearly different from the interactive Ondura Setup.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content apps/ondura/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $nsis = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Move-Item $nsis.FullName "target/release/bundle/nsis/Ondura_${version}_x64_SilentInstall.exe"
      - name: Build Ondura Setup (Office-style installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $payload = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          $env:ONDURA_SETUP_PAYLOAD = $payload.FullName
          $env:ONDURA_SETUP_APP_SIZE = (Get-Item target/release/ondura.exe).Length
          $version = (Get-Content apps/ondura/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          Push-Location apps/setup
          node ../ondura/node_modules/@tauri-apps/cli/tauri.js build --no-bundle
          Pop-Location
          New-Item -ItemType Directory -Force target/release/bundle/setup | Out-Null
          Copy-Item target/release/ondura-setup.exe "target/release/bundle/setup/Ondura_${version}_x64_Setup.exe"
          & pwsh -NoProfile -File scripts/windows-sign.ps1 "target/release/bundle/setup/Ondura_${version}_x64_Setup.exe"
          if ($LASTEXITCODE -ne 0) { throw "signing Ondura Setup failed" }
      - name: Package the macOS app for the updater
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version=$(jq -r .version apps/ondura/src-tauri/tauri.conf.json)
          dir=target/universal-apple-darwin/release/bundle/macos
          tar -czf "$dir/Ondura_${version}_universal.app.tar.gz" -C "$dir" Ondura.app
      - name: Sign for the updater
        # Minisign signatures (`<file>.sig`) that Ondura checks before installing.
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then echo "No TAURI_SIGNING_PRIVATE_KEY secret: updates are not signed."; exit 0; fi
          shopt -s nullglob
          for f in target/release/bundle/nsis/*.exe target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm target/release/bundle/appimage/*.AppImage target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz; do
            node apps/ondura/node_modules/@tauri-apps/cli/tauri.js signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$f"
          done
      - uses: actions/upload-artifact@v5
        with:
          name: ondura-${{ runner.os }}
          path: |
            target/release/bundle/setup/*.exe
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.sig
            target/release/bundle/deb/*.deb
            target/release/bundle/deb/*.sig
            target/release/bundle/rpm/*.rpm
            target/release/bundle/rpm/*.sig
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.sig
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            target/universal-apple-darwin/release/bundle/macos/*.sig
          if-no-files-found: error

  release:
    # A tag `vX.Y.Z` (release.yml or scripts/release.sh) publishes a GitHub
    # release; Ondura's updater finds it through the API.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches the version
        run: |
          version=$(jq -r .version apps/ondura/src-tauri/tauri.conf.json)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Artifacts keep their folders (bundle/nsis, release/bundle/macos, …):
          # collect all files flat for the release.
          mkdir -p release
          find dist -type f -exec cp {} release/ \;
          # Ondura 0.1.1 and older look for `…_x64-setup.exe` (the name before
          # the silent installer was renamed): publish it under that name too,
          # so those installations can still update themselves.
          for f in release/*_x64_SilentInstall.exe; do
            [ -e "$f" ] || continue
            old="${f%_SilentInstall.exe}-setup.exe"
            cp "$f" "$old"
            [ -e "$f.sig" ] && cp "$f.sig" "$old.sig"
          done
          ls -la release
          if ! ls release/*.sig >/dev/null 2>&1; then echo "::warning::No .sig files – set the TAURI_SIGNING_PRIVATE_KEY secret, otherwise Ondura can't install this update by itself."; fi
          # Re-running the workflow replaces the files of an existing release.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            # Shown above the generated notes: the builds are not signed with
            # a Microsoft/Apple certificate, so the first start shows a warning.
            cat > notes.md <<'NOTES'
          > [!NOTE]
          > **First installation:** Windows SmartScreen or macOS Gatekeeper warns about an unknown publisher, because Ondura is not signed with a paid certificate yet. Updates install without this warning.
          > - **Windows:** *Windows protected your PC* › **More info** › **Run anyway**.
          > - **macOS:** close the message, then *System Settings › Privacy & Security* › **Open Anyway** next to Ondura (on macOS 14 and older: right-click Ondura in *Applications* › **Open**).
          >
          > **Erste Installation:** Windows SmartScreen bzw. macOS Gatekeeper warnt vor einem unbekannten Herausgeber, weil Ondura noch nicht mit einem kostenpflichtigen Zertifikat signiert ist. Updates installieren sich ohne diese Warnung.
          > - **Windows:** *Der Computer wurde durch Windows geschützt* › **Weitere Informationen** › **Trotzdem ausführen**.
          > - **macOS:** Meldung schließen, dann *Systemeinstellungen › Datenschutz & Sicherheit* › **Dennoch öffnen** neben Ondura (bis macOS 14: Rechtsklick auf Ondura in *Programme* › **Öffnen**).
          NOTES
            gh release create "$GITHUB_REF_NAME" --verify-tag --latest --title "Ondura ${GITHUB_REF_NAME#v}" --generate-notes --notes-file notes.md release/*
          fi
