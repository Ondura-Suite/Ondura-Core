[package]
name = "ondura-setup"
description = "Ondura Setup – Office-style installer and updater for Windows"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json.workspace = true

[dependencies]
ondura-i18n.workspace = true
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_Shell", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_ToolHelp"] }

[features]
# Enabled by `tauri build` for production builds.
custom-protocol = ["tauri/custom-protocol"]
