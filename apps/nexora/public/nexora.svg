<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d72f6"/>
      <stop offset="0.5" stop-color="#4f54d4"/>
      <stop offset="1" stop-color="#2f2f9e"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.15" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#f0abfc" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#f0abfc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.95" cy="0.95" r="0.7">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#e6e8ff" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#glow1)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#glow2)"/>
  <!-- N from three glass strokes; the diagonal is lighter so the overlap reads as layered glass -->
  <rect x="16" y="15" width="8" height="34" rx="4" fill="url(#glass)"/>
  <rect x="40" y="15" width="8" height="34" rx="4" fill="url(#glass)"/>
  <path d="M20 19l24 26" stroke="#fff" stroke-opacity="0.55" stroke-width="8" stroke-linecap="round"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#shine)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="15.5" fill="none" stroke="#fff" stroke-opacity="0.35"/>
</svg>
