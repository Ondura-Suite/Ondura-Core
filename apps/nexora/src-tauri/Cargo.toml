[package]
name = "nexora"
description = "Nexora – desktop suite (Mail, Kalender, Kontakte, …)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nexora-mail-core.workspace = true
nexora-mail-imap.workspace = true
nexora-mail-graph.workspace = true
nexora-mail-ews.workspace = true
nexora-pim-core.workspace = true
nexora-pim-dav.workspace = true
chrono.workspace = true

tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
directories = "6"

# OS credential store: Windows Credential Manager / Secret Service (GNOME Keyring, KWallet).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native-sync-persistent", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[features]
# Enabled by `tauri build` for production bundles.
custom-protocol = ["tauri/custom-protocol"]
