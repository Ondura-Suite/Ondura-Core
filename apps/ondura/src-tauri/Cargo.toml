[package]
name = "ondura"
description = "Ondura – office suite: Mail (with calendar, contacts and tasks), Text, Tabellen, Präsentation"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

# All of Ondura is the library; `ondura` (and on Windows the per-app
# programs of apps/ondura/launcher, through ondura_core.dll) only start it.
[lib]
name = "ondura_app"
path = "src/lib.rs"

[[bin]]
name = "ondura"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ondura-i18n.workspace = true
ondura-mail-core.workspace = true
ondura-mail-imap.workspace = true
ondura-mail-graph.workspace = true
ondura-mail-ews.workspace = true
ondura-pim-core.workspace = true
ondura-pim-dav.workspace = true
ondura-office.workspace = true
ondura-smime.workspace = true
chrono.workspace = true

tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
# Dragging files (attachments, messages) out of a window onto the desktop.
drag = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
directories = "6"
reqwest.workspace = true
futures.workspace = true
quick-xml.workspace = true
base64.workspace = true
# Signature check of downloaded updates (minisign, as written by `tauri signer`).
minisign-verify = "0.2"

# OS credential store: Windows Credential Manager / Secret Service (GNOME Keyring, KWallet).
# webview2-com / windows and webkit2gtk / gtk (same versions as wry) are used
# for the PDF export (src/pdf.rs).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
tauri-winrt-notification = "0.8"
webview2-com = "0.39"
windows-service = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Printing", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# Release builds: `ondura.exe` starts the shared ondura_core.dll.
ondura-launcher = { path = "../launcher" }
# PDF export and the per-app taskbar identity (AppUserModelID).
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_EnhancedStorage", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
keyring = { version = "3", features = ["linux-native-sync-persistent", "crypto-rust"] }
webkit2gtk = "2.0"
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
# PDF export through WKWebView's print operation (src/pdf.rs); same versions as wry.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSPrintInfo"] }

[features]
# Enabled by `tauri build` for production bundles.
custom-protocol = ["tauri/custom-protocol"]
