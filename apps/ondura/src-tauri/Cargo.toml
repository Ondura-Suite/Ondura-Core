[package]
name = "ondura"
description = "Ondura – desktop suite (Mail, Kalender, Kontakte, …)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ondura-mail-core.workspace = true
ondura-mail-imap.workspace = true
ondura-mail-graph.workspace = true
ondura-mail-ews.workspace = true
ondura-pim-core.workspace = true
ondura-pim-dav.workspace = true
ondura-office.workspace = true
ondura-smime.workspace = true
chrono.workspace = true

tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
directories = "6"
reqwest.workspace = true
base64.workspace = true
# Signature check of downloaded updates (minisign, as written by `tauri signer`).
minisign-verify = "0.2"

# OS credential store: Windows Credential Manager / Secret Service (GNOME Keyring, KWallet).
# webview2-com / windows and webkit2gtk / gtk (same versions as wry) are used
# for the PDF export (src/pdf.rs).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
webview2-com = "0.39"
windows = "0.62"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native-sync-persistent", "crypto-rust"] }
webkit2gtk = "2.0"
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[features]
# Enabled by `tauri build` for production bundles.
custom-protocol = ["tauri/custom-protocol"]
