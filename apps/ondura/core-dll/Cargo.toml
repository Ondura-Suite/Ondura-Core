[package]
name = "ondura-core-dll"
description = "Ondura – the suite as ondura_core.dll, shared by the per-app programs on Windows"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

# Built for Windows releases only (scripts/windows-binaries.ps1); the
# programs of apps/ondura/launcher load it.
[lib]
name = "ondura_core"
crate-type = ["cdylib"]

[dependencies]
ondura = { path = "../src-tauri" }

[features]
# Same as the app crate: production assets, enabled for releases.
custom-protocol = ["ondura/custom-protocol"]
